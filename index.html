<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Онлайн Фоторедактор — Кадрирование для маркетплейсов и Удаление фона</title>
  <meta name="description" content="Бесплатный онлайн редактор фото. Быстрое кадрирование под Wildberries, Ozon и удаление фона за 1 клик.">
  
  <!-- Подключение стилей Cropper.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>Фоторедактор для Маркетплейсов</h1>
  </header>

  <main class="container">
    <!-- Панель управления -->
    <aside class="sidebar">
      <div class="section">
        <h3>1. Загрузка</h3>
        <input type="file" id="uploadInput" accept="image/*">
      </div>

      <div class="section">
        <h3>2. Пресеты (Маркетплейсы)</h3>
        <button type="button" class="btn" id="btnSquare">Wildberries / Ozon (1:1)</button>
        <button type="button" class="btn" id="btnFashion">WB Одежда (3:4)</button>
        <button type="button" class="btn" id="btnLandscape">Товары (4:3)</button>
        <button type="button" class="btn btn-secondary" id="btnFree">Произвольно</button>
      </div>

      <div class="section">
        <h3>3. Инструменты</h3>
        <button type="button" class="btn btn-action" id="btnRemoveBg">Удалить фон (Remove.bg)</button>
        <button type="button" class="btn btn-success" id="btnDownload">Скачать результат</button>
      </div>
    </aside>

    <!-- Область предпросмотра -->
    <section class="preview-area">
      <div class="img-container">
        <img id="image" src="" alt="Загруженное изображение" style="display: none;">
      </div>
    </section>
  </main>

  <!-- Скрипты -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
